<style>
/* Layout: full-bleed 3D site with floating panels — brand bar top-left, plan top-right, stop card + stop rail along the bottom.
   One committed look taken from the event invitation: deep Baban green, leaf green, invitation gold. */
:root {
  --ink: #0d241b;          /* panel ground */
  --green: #1f4d3a;        /* brand green */
  --leaf: #4a8c6f;         /* logo leaf */
  --gold: #c9a24a;         /* invitation gold */
  --paper: #f3eee1;        /* text on green */
  --muted: #b9c7bd;        /* secondary text */
  --line: rgba(201, 162, 74, 0.35);
  --glass: rgba(13, 36, 27, 0.78);
  --f-ui: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-ar: "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--ink); color: var(--paper); font-family: var(--f-ui); }
#app { position: relative; height: 100%; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#view.dragging { cursor: grabbing; }
.panel { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; }
button { font: inherit; color: inherit; }
button:focus-visible, #view:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* top bar */
.top { position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 10px; pointer-events: auto; min-width: 0; }
.brand canvas { width: 40px; height: 40px; flex: none; }
.brand b { display: block; font-weight: 800; letter-spacing: 0.16em; font-size: 15px; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { margin-left: auto; display: flex; gap: 8px; pointer-events: auto; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; font-weight: 600; font-size: 13px; letter-spacing: 0.02em; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.btn:hover { border-color: var(--gold); }
.btn.gold { background: var(--gold); color: #1b1407; border-color: var(--gold); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--glass); height: 40px; }
.lang button { border: 0; background: transparent; padding: 0 12px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--green); color: var(--paper); }
.lang button.ar { font-family: var(--f-ar); }

/* site plan */
.plan { position: absolute; top: 64px; right: max(16px, env(safe-area-inset-right, 0px)); width: 268px; padding: 10px 10px 8px; }
.plan h2 { margin: 0 0 6px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; color: var(--gold); text-transform: uppercase; }
.plan canvas { display: block; width: 100%; aspect-ratio: 4 / 3; cursor: crosshair; border-radius: 8px; }
.plan p { margin: 6px 2px 0; font-size: 10.5px; color: var(--muted); }

/* stop card */
.card { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 86px; width: min(440px, calc(100% - 32px)); padding: 16px 18px 14px; }
.card .eyebrow { font-size: 11px; letter-spacing: 0.16em; color: var(--gold); font-weight: 700; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.card h1 { margin: 6px 0 4px; font-size: 21px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.card p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
.card .nav { display: flex; gap: 8px; margin-top: 12px; }
.card .nav button { flex: 1; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 600; }
.card .nav button:hover { border-color: var(--gold); }
[dir="rtl"] .card, .card[dir="rtl"] { font-family: var(--f-ar); }
.card[dir="rtl"] .eyebrow { letter-spacing: 0; }

/* stop rail */
.rail { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; gap: 8px; overflow-x: auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 8px; border-radius: 22px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; font-size: 12.5px; font-weight: 600; white-space: nowrap; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.chip i { font-style: normal; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: var(--gold); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip[aria-current="true"] { background: var(--gold); color: #1b1407; border-color: var(--gold); }
.chip[aria-current="true"] i { background: #1b1407; color: var(--gold); }
.rail[dir="rtl"] .chip { font-family: var(--f-ar); padding: 0 8px 0 14px; }

/* pins in the scene */
.pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pin { position: absolute; left: 0; top: 0; pointer-events: auto; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; border: 0; background: none; cursor: pointer; padding: 0; transition: opacity .25s; }
.pin .dot { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: #1b1407; font-weight: 800; font-size: 12px; box-shadow: 0 0 0 4px rgba(201,162,74,.28), 0 4px 10px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
.pin .stem { width: 2px; height: 14px; background: var(--gold); }
.pin .lbl { position: absolute; bottom: 52px; white-space: nowrap; font-size: 11.5px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: var(--glass); border: 1px solid var(--line); opacity: 0; transform: translateY(4px); transition: .18s; }
.pin:hover .lbl, .pin:focus-visible .lbl { opacity: 1; transform: none; }

/* hint + loader */
.hint { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); padding: 8px 14px; font-size: 12px; color: var(--paper); white-space: nowrap; transition: opacity .6s; pointer-events: none; }
.hint.gone { opacity: 0; }
.loader { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #1f4d3a, #0d241b 70%); z-index: 5; transition: opacity .7s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader div { text-align: center; }
.loader canvas { width: 96px; height: 96px; }
.loader b { display: block; margin-top: 10px; font-weight: 800; letter-spacing: 0.22em; font-size: 20px; }
.loader span { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
.loader .bar { width: 160px; height: 2px; background: rgba(255,255,255,.12); margin: 16px auto 0; overflow: hidden; border-radius: 2px; }
.loader .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--gold); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.err { color: #f0c27a; font-size: 13px; max-width: 320px; margin: 14px auto 0; line-height: 1.5; }

@media (max-width: 760px) {
  .brand span { display: none; }
  .brand b { white-space: nowrap; letter-spacing: 0.1em; font-size: 13.5px; }
  .lang button { padding: 0 9px; }
  .tools { gap: 6px; }
  .brand { padding: 6px 12px 6px 8px; }
  .brand canvas { width: 32px; height: 32px; }
  .btn .t { display: none; }
  .btn { padding: 0 12px; }
  .plan { width: 150px; top: 60px; padding: 6px; }
  .plan h2, .plan p { display: none; }
  .card { bottom: 74px; padding: 12px 14px; }
  .card h1 { font-size: 17px; }
  .card p { font-size: 12.5px; }
  .card .nav { display: none; }
  .chip { height: 40px; }
  .hint { top: auto; bottom: 200px; font-size: 11px; white-space: normal; text-align: center; width: max-content; max-width: calc(100% - 32px); }
}
@media (prefers-reduced-motion: reduce) { .loader .bar::after { animation: none; } }
</style>

  const d = [b[0] - a[0], b[1] - a[1]]; const L = Math.hypot(...d); const n = rightOf([d[0] / L, d[1] / L]);

map.addEventListener('click', e => {
  const r = map.getBoundingClientRect(); const [u, v] = mapInv((e.clientX - r.left) / r.width * map.width, (e.clientY - r.top) / r.height * map.height);

  const P = new THREE.Vector3(u, 1.7, v); const yaw = cam.mode === 'orbit' ? Math.atan2(SITE_C[0] - u, SITE_C[1] - v) : cam.yaw;
  stopAuto(); hideHint(); flyTo(P, P.clone().add(new THREE.Vector3(Math.sin(yaw), -0.02, Math.cos(yaw)).multiplyScalar(8)), 60, 'walk', undefined, updateNearest);
});

// ---------- pins ----------
const _p = new THREE.Vector3();
function placePins() {
  const r = view.getBoundingClientRect();
  for (const s of STOPS) if (s.pinEl) {
    _p.copy(s.PIN).project(camera); const dist = camera.position.distanceTo(s.PIN);
    const vis = _p.z < 1 && _p.z > -1 && Math.abs(_p.x) < 1.05 && Math.abs(_p.y) < 1.05 && dist > 6 && dist < 300;
    if (!vis) { s.pinEl.style.opacity = 0; s.pinEl.style.visibility = 'hidden'; continue; }
    s.pinEl.style.visibility = 'visible'; s.pinEl.style.opacity = dist > 140 ? 0.75 : 1;
    s.pinEl.style.transform = `translate(${(_p.x + 1) / 2 * r.width}px, ${(1 - _p.y) / 2 * r.height}px) translate(-50%, -100%)`;

}

// ---------- loop ----------
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isTouch ? 1.5 : 1.75)); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = effFov(cam.fov); camera.updateProjectionMatrix(); sizeMap(); dirty = true;
}
addEventListener('resize', resize);
function effFov(f) { const a = camera.aspect; if (a >= 1.2) return f; const h = 2 * Math.atan(Math.tan(f * D2R / 2) * 1.2); return Math.min(92, 2 * Math.atan(Math.tan(h / 2) / a) / D2R); }

const _P = new THREE.Vector3(), _T = new THREE.Vector3(), _f = new THREE.Vector3();
let last = performance.now(), shadowKey = '';
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  tickKeys(dt); tickAuto(dt);
  if (flight) {
    flight.t += dt; const x = Math.min(1, flight.t / flight.dur), e = ease3(x);
    _P.lerpVectors(flight.P0, flight.P1, e); _P.y += flight.arc * Math.sin(Math.PI * e);
    _T.lerpVectors(flight.T0, flight.T1, e);

    camera.position.copy(_P); camera.lookAt(_T);
    if (x >= 1) { const f = flight; flight = null; setFromPT(f.P1, f.T1, f.mode); f.onDone && f.onDone(); }
    dirty = true;
  }
  if (!flight) { const [P, T] = camPT(); camera.position.copy(P); camera.lookAt(T); }
  if (dirty) {
    const ef = effFov(cam.fov); if (camera.fov !== ef) { camera.fov = ef; camera.updateProjectionMatrix(); }
    sky.position.copy(camera.position);
    camera.getWorldDirection(_f);
    const far = camera.position.y > 15;
    const G = 6, focus = far ? new THREE.Vector3(SITE_C[0], 0, SITE_C[1]) : new THREE.Vector3(Math.round((camera.position.x + _f.x * 14) / G) * G, 0, Math.round((camera.position.z + _f.z * 14) / G) * G);
    const sk = far ? 'far' : focus.x + ',' + focus.z;
    if (sk !== shadowKey) { shadowKey = sk; setShadow(focus, far ? 110 : 48); renderer.shadowMap.needsUpdate = true; }
    renderer.render(scene, camera); placePins(); drawMap();

  }

}

// merge static meshes by material: ~1,500 draw calls become a few dozen
function mergeStatic() {
  scene.updateMatrixWorld(true);
  const groups = new Map(), done = [];
  scene.traverse(o => {
    if (!o.isMesh || o === sky || Array.isArray(o.material) || !(o.material.isMeshStandardMaterial || o.material.isMeshLambertMaterial)) return;
    const g = o.geometry; if (!g.attributes.position || !g.attributes.normal || !g.attributes.uv || g.morphAttributes.position) return;
    const geo = g.index ? g.toNonIndexed() : g.clone();
    for (const k of Object.keys(geo.attributes)) if (!['position', 'normal', 'uv'].includes(k)) geo.deleteAttribute(k);
    geo.clearGroups(); geo.applyMatrix4(o.matrixWorld);
    const mt = o.material, key = [mt.type, mt.color.getHexString(), mt.roughness, mt.metalness, mt.map ? mt.map.uuid : '', mt.emissive.getHexString(), mt.emissiveIntensity, mt.emissiveMap ? mt.emissiveMap.uuid : '', mt.transparent, mt.opacity, mt.side, mt.alphaTest, mt.polygonOffset, o.castShadow, o.receiveShadow].join('|');
    if (!groups.has(key)) groups.set(key, { mat: o.material, cast: o.castShadow, recv: o.receiveShadow, list: [], src: [] });

    const merged = mergeGeometries(e.list, false);

    const m = new THREE.Mesh(merged, e.mat); m.castShadow = e.cast; m.receiveShadow = e.recv; scene.add(m);

// boot
mergeStatic();
renderer.shadowMap.autoUpdate = false;
applyLang(); resize();
setFromPT(V3([SITE_C[0] - 92, 70, SITE_C[1] + 126]), STOPS[0].T, 'orbit'); cam.fov = 50;
renderer.compile(scene, camera);
requestAnimationFrame(t => { last = t; frame(t); goTo(0, 3.2); setTimeout(() => $('loader').classList.add('done'), 250); });
window.__tour = { goTo, STOPS, cam, renderer, scene };

</script>
